[package]
name = "lom-desktop"
version = "0.1.0"
description = "Lom desktop UI and local document workspace"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
[lib]
name = "lom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
getrandom = "0.3"
dirs = "6"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
