<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>正在登录 · Lom</title>
<style>
:root{--bg:#f6f8f6;--surface:#fff;--ink:#17221b;--muted:#7b857e;--line:#e3e9e4;--brand:#168341;--soft:#eaf6ed;--danger:#b64a42;--shadow:0 24px 80px #1d482414}
@media(prefers-color-scheme:dark){:root{--bg:#131715;--surface:#1b211d;--ink:#edf4ef;--muted:#9aa99e;--line:#303d34;--brand:#68d88e;--soft:#203c29;--danger:#f09389;--shadow:0 24px 80px #0003}.brand img{filter:invert(1);mix-blend-mode:screen}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(ellipse at 50% 0,var(--soft),transparent 65%),var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
main{width:min(100%,480px);text-align:center}.brand{display:flex;justify-content:center;align-items:center;gap:10px;font-size:27px;font-weight:650;letter-spacing:-1px;margin-bottom:32px}.brand img{width:40px;height:36px;object-fit:contain;mix-blend-mode:multiply}.card{padding:44px 32px 32px;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
.symbol{width:76px;height:76px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--brand)}.symbol svg{width:34px;height:34px}.spinner{border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;width:32px;height:32px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:27px;letter-spacing:-.03em;margin:0 0 12px;font-weight:600}p{margin:0;color:var(--muted)}.description{min-height:54px;margin:0 auto 28px;max-width:340px}.action{width:100%;border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:600;background:var(--brand);color:var(--surface);cursor:pointer;transition:transform .15s}.action:hover{transform:translateY(-1px)}.action:focus-visible{outline:3px solid var(--brand);outline-offset:4px}.footnote{font-size:12px;margin-top:18px}.steps{display:flex;justify-content:center;gap:22px;border-top:1px solid var(--line);margin-top:30px;padding-top:22px;font-size:12px;color:var(--muted)}.steps span::before{content:"·";margin-right:6px}.steps .done{color:var(--brand)}.steps .done::before{content:"✓"}.page-foot{font-size:12px;margin-top:26px;letter-spacing:.04em}.error .symbol{color:var(--danger);background:transparent;border:1px solid var(--line)}@media(prefers-reduced-motion:reduce){.spinner{animation:none}.action{transition:none}}@media(max-width:420px){.card{padding:34px 22px 26px}.steps{gap:12px}}
</style></head>
<body><main><div class="brand"><img src="data:image/png;base64,__LOGO__" alt=""><span>Lom</span></div><section class="card" aria-live="polite"><div class="symbol" id="symbol"><div class="spinner"></div></div><h1 id="title">正在完成登录</h1><p class="description" id="description">账号授权已返回，正在验证身份并连接你的 Lom 工作台。</p><button class="action" id="return" type="button">返回 Lom</button><p class="footnote" id="hint">此页面会自动更新，请稍候。</p><div class="steps"><span class="done">账号授权</span><span id="verify">身份验证</span><span id="ready">准备就绪</span></div></section><p class="page-foot">从一个想法开始，和 Lom 一起完成。</p></main>
<script>
const headers={'X-Lom-Callback':'__NONCE__'};let settled=false;let failures=0;
const title=document.getElementById('title'),description=document.getElementById('description'),symbol=document.getElementById('symbol'),hint=document.getElementById('hint');
function show(state){if(state==='pending')return;settled=true;clearInterval(timer);const ok=state==='success';document.title=ok?'登录成功 · Lom':'登录未完成 · Lom';title.textContent=ok?'登录成功，欢迎回来':'这次登录没有完成';description.textContent=ok?'你的账号已连接，可以回到 Lom 开始新的任务。':'请返回 Lom 查看原因并重新登录。你的原有账号与任务不会被删除。';hint.textContent=ok?'可以放心关闭此页面。':'无需重复刷新此页面。';symbol.innerHTML=ok?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v7m0 4h.01"/></svg>';document.querySelector('.card').classList.toggle('error',!ok);document.querySelector('.steps span').classList.toggle('done',ok);if(ok){document.getElementById('verify').className='done';document.getElementById('ready').className='done'}}
async function poll(){if(settled)return;try{const r=await fetch('/status',{headers,cache:'no-store'});if(!r.ok)throw Error();show((await r.json()).state);failures=0}catch{if(++failures>=10){settled=true;clearInterval(timer);document.title='请返回 Lom · Lom';title.textContent='请回到 Lom 查看结果';description.textContent='暂时无法连接本机应用。若已经关闭 Lom，请重新打开；你的登录结果以应用内显示为准。';symbol.innerHTML='<span aria-hidden="true">↗</span>';hint.textContent='此页面未能确认登录结果。'}}}
document.getElementById('return').onclick=async()=>{try{const r=await fetch('/return',{method:'POST',headers});if(!r.ok)throw Error();hint.textContent='已切换到 Lom，你可以关闭此页面。'}catch{hint.textContent='请从 Dock 或应用程序中打开 Lom。'}};
const timer=setInterval(poll,700);show('__INITIAL__');if(!settled)poll();setTimeout(()=>{if(!settled){settled=true;clearInterval(timer);title.textContent='登录等待已结束';description.textContent='请返回 Lom 重新发起登录。';symbol.innerHTML='<span aria-hidden="true">↗</span>';}},300000);
</script></body></html>
